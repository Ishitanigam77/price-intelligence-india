[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# The real URL is injected at runtime by alembic/env.py from the DATABASE_URL environment
# variable (see app.core.config.Settings). This placeholder is only used by tooling that reads
# alembic.ini directly and is intentionally not a real credential.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
