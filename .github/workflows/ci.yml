# Continuous integration for pull requests and pushes to main.
#
# GitHub Actions is the repository CI gate (validate, lint, test, security, Docker build).
# Azure DevOps (`infrastructure/pipelines/`) is the CD path: ACR push, environment deploys,
# smoke tests, and production approval. This workflow does not deploy and does not provision Azure.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_USER: priceradar_app
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: priceradar_test
  TEST_DATABASE_URL: postgresql+psycopg://priceradar_app:changeme@localhost:5432/priceradar_test
  DATABASE_URL: postgresql+psycopg://priceradar_app:changeme@localhost:5432/priceradar_test
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/2

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse pipeline YAML and smoke-script tests
        run: |
          python -m pip install pyyaml pytest
          python infrastructure/pipelines/scripts/validate_yaml.py
          PYTHONPATH=infrastructure/pipelines/scripts python -m pytest infrastructure/pipelines/scripts/test_smoke_test.py -q --tb=short

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: terraform validate
        run: |
          set -euo pipefail
          for env in bootstrap environments/dev environments/staging environments/prod; do
            terraform -chdir="infrastructure/terraform/${env}" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/${env}" validate
          done

  backend:
    name: Backend lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priceradar_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: priceradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priceradar_app -d priceradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest unit (excluding workers and ml; those have dedicated jobs)
        run: python -m pytest tests/unit --ignore=tests/unit/workers --ignore=tests/unit/ml -q --tb=short

  workers:
    name: Worker unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priceradar_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: priceradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priceradar_app -d priceradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest workers
        run: python -m pytest tests/unit/workers -q --tb=short

  ml:
    name: ML unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priceradar_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: priceradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priceradar_app -d priceradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest ML
        run: python -m pytest tests/unit/ml -q --tb=short

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priceradar_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: priceradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priceradar_app -d priceradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest integration
        run: python -m pytest tests/integration -q --tb=short

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Vitest
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  security:
    name: Dependency and IaC security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e "./backend[dev]"
          pip-audit --progress-spinner off
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Checkov
        run: |
          python -m pip install checkov
          checkov -d infrastructure/terraform --config-file infrastructure/terraform/checkov.yaml
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: .git,.venv,frontend/node_modules,frontend/.next
          trivy-config: infrastructure/security/trivy.yaml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [validate, terraform, backend, workers, ml, integration, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend API image
        run: docker build --target api -t priceradar/backend:ci backend
      - name: Build worker image
        run: docker build --target worker -t priceradar/workers:ci backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -t priceradar/frontend:ci frontend
      - name: Build ML image
        run: docker build -f ml/Dockerfile -t priceradar/ml:ci .
      - name: Trivy image scans
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: priceradar/backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: priceradar/workers:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: priceradar/frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy ML image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: priceradar/ml:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
