# Continuous integration for pull requests and pushes to main.
#
# This workflow only builds, lints, and tests. It does not deploy, provision Azure,
# publish images, or run notification/billing jobs.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same non-secret local placeholders as `.env.example`. Never inject real credentials.
  POSTGRES_USER: priceradar_app
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: priceradar_test
  TEST_DATABASE_URL: postgresql+psycopg://priceradar_app:changeme@localhost:5432/priceradar_test
  DATABASE_URL: postgresql+psycopg://priceradar_app:changeme@localhost:5432/priceradar_test
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/2

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priceradar_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: priceradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priceradar_app -d priceradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: python -m pytest tests -q --tb=short

  frontend:
    name: Frontend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Vitest
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
