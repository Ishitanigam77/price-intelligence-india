# Local development stack for PriceRadar India.
#
# Usage (from the repository root):
#   cp .env.example .env            # then edit .env with your own local values
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#
# This is a *local development* compose file only — it is not a production deployment
# artifact. Production hosting is Azure Container Apps (see `infrastructure/terraform/` and
# `infrastructure/CICD.md`). No secrets are hardcoded here: every credential is sourced from
# the `.env` file (never committed) via `env_file`, falling back to the same non-secret local
# placeholder values documented in `.env.example`.
#
# Services match what exists in the repository: PostgreSQL, Redis, FastAPI backend, Celery
# worker, Next.js frontend, and the ML liveness/training image.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-priceradar_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-priceradar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - priceradar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-priceradar_app} -d ${POSTGRES_DB:-priceradar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-priceradar_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-priceradar}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-priceradar_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-priceradar}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RUN_DB_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Server-only. Never bake this into the image as a build-arg.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ml:
    build:
      context: ../..
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-priceradar_app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-priceradar}
      REDIS_URL: redis://redis:6379/0
      ML_MODEL_ARTIFACT_PATH: ${ML_MODEL_ARTIFACT_PATH:-}
      ML_HEALTH_PORT: "8080"
      RUN_DB_MIGRATIONS: "false"
    ports:
      - "${ML_HEALTH_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  priceradar_postgres_data:
    # Persists PostgreSQL data across `docker compose down`/`up` cycles in local development.
    # Use `docker compose down -v` to discard it entirely.
